version: "3"

tasks:
  demo:
    desc: create demo of CLI usage
    preconditions:
      - sh: which vhs
        msg: "vhs is not installed. Please install it from https://github.com/charmbracelet/vhs"
    cmds:
      - vhs docs/demo.tape

  build:
    desc: build the CLI binary
    cmds:
      - go build -o bin/spotify-setlist

  coverage:
    deps: [test]
    desc: run unit tests and create HTML coverage file
    cmds:
      - go tool cover -html=coverage.txt

  fmt:
    desc: auto-format all go files
    preconditions:
      - sh: which golangci-lint
        msg: "golangci-lint is not installed. Please install it from https://golangci-lint.run/usage/install/"
    cmds:
      - golangci-lint fmt --verbose

  lint:
    desc: lint all go files
    preconditions:
      - sh: which golangci-lint
        msg: "golangci-lint is not installed. Please install it from https://golangci-lint.run/usage/install/"
    cmds:
      - golangci-lint run

  mocks:
    desc: generate new mocks from scratch
    cmds:
      - task: mocks.remove
      - task: mocks.generate

  mocks.remove:
    desc: remove all mock files
    cmds:
      - find . -name '*mock.gen.go' | xargs -r rm
      - find ./internal -type d -name "*mocks" | xargs -r rm -rf

  mocks.generate:
    desc: generate mocks
    preconditions:
      - sh: which mockery
        msg: "mockery is not installed. Please install it from https://vektra.github.io/mockery/latest/installation/#homebrew"
    cmds:
      - mockery

  test:
    cmds:
      - go run gotest.tools/gotestsum@latest --format testdox -- -v -coverprofile=coverage.txt $(go list ./... | grep -v /mocks)
    desc: run unit tests
    generates:
      - coverage.txt
    deps:
      - mocks.generate
